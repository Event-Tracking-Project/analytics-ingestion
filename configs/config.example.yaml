# HTTP server settings.
server:
  host: "localhost"
  port: 8080

# Redis queue settings shared by the API and worker processes.
redis:
  address: "localhost:6379"
  password: ""
  database: 0
  stream: "analytics:batches"
  consumer_group: "analytics-workers"

# PostgreSQL settings used by the worker process.
database:
  host: "localhost"
  port: "5432"
  name: "analytics"
  user: "analytics"
  password: "change-me"
  ssl_mode: "disable"
  max_connections: 10
  min_connections: 2

# Application logging settings.
logging:
  enabled: true
  # Supported levels: debug, info, warn, error.
  level: "info"
  # Supported destinations: stdout, file.
  destination: "file"
  file:
    # The directory is created automatically when file logging is enabled.
    path: "./logs/ingestion.log"
  # Log validation failures for individual events in a batch.
  failed_events: true

# Ingestion limits.
ingestion:
  # Maximum number of events accepted in one batch request.
  max_batch_size: 100

# Worker settings.
workers:
  # Number of workers started by the standalone worker process.
  count: 4
  # Retained for compatibility. Standalone workers always start at startup.
  start_on_demand: false